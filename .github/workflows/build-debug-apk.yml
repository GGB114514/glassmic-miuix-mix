name: 构建 Debug APK（可用于仓库副本 / fork）

# 说明：上游自带的 build-apk.yml 里有 `if: github.repository == 'lm060719/io.mo.glassmic'`
# 这一条门卫，套在你自己的仓库上整个 job 会被直接跳过；而且它跑 assembleRelease，
# 必须有签名四件套 secrets 才能过。本文件专为「套了 MiuiX + 混音改动后想先出个包验证」准备：
#   1. 没有任何仓库名判断，fork 也能跑
#   2. 只跑 assembleDebug，用 Gradle 默认的 debug keystore 自动签名，不需要配任何 secret
#   3. 产物用 upload-artifact 直接下载
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    # x86_64 宿主是硬要求：Google 官方 SDK 只提供 linux/x64 的 aapt2、zipalign、NDK 宿主二进制
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Java 17 与 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # 版本号来自工程本身，别改：app 模块 compileSdk=36，xposed/core 是 35，
      # xposed/build.gradle.kts 锁 ndkVersion 26.1.10909125 与 CMake 3.22.1
      - name: 安装工程要求的 SDK 与原生工具链
        run: sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: 编译 Debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace

      # 先只验 Kotlin 类型是否正确，不让 native 构建问题干扰判断
      - name: 分模块编译检查（定位报错归属）
        if: always()
        run: |
          bash ./gradlew :core:compileDebugKotlin :xposed:compileDebugKotlin \
            --no-daemon --console=plain || true

      - name: 音频与回调时序回归检查
        continue-on-error: true
        run: |
          set -euo pipefail
          stdlib=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-stdlib" \
                   -name 'kotlin-stdlib-*.jar' ! -name '*sources*' ! -name '*javadoc*' | sort -V | tail -1)
          test -n "$stdlib"
          mkdir -p build/audio-regression
          classpath="app/build/tmp/kotlin-classes/debug:xposed/build/tmp/kotlin-classes/debug:$stdlib:build/audio-regression"
          javac -encoding UTF-8 -cp "$classpath" -d build/audio-regression tests/audio/AudioRegression.java tests/audio/TapTimingRegression.java
          java -cp "$classpath" AudioRegression
          java -cp "$classpath" TapTimingRegression

      - name: 产物摘要
        run: |
          ls -l app/build/outputs/apk/debug/ || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "### APK 构建成功" >> "$GITHUB_STEP_SUMMARY"
            echo "路径 \`app/build/outputs/apk/debug/app-debug.apk\`，可直接下载附件 app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK 未产出，请看上一步日志里的 e: 行" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glassmic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
